// The dashboard's data: everything stored in the browser and synced to Drive.
//
// Stored as protobuf binary (storage/codec.ts), with protobuf's JSON form
// alongside as a read-only copy for people. Never renumber, retype or reuse a
// field or enum value (mark removed ones `reserved`). Adding a field is safe:
// older versions of the app keep fields they don't know when they save. Raise
// schema_version for any change older versions can't handle; they refuse such
// data and ask to be updated.
//
// Dates are `YYYY-MM-DD` and times of day `HH:MM`, in local time; timestamps
// are ISO 8601 strings.
syntax = "proto3";

package dashboard;

message AppData {
  // Raised on every change older versions of the app can't read correctly;
  // they refuse data with a higher version and ask to be updated.
  int32 schema_version = 1;
  repeated Area areas = 2;
  repeated Project projects = 3;
  repeated Item items = 4;
  repeated Allocation allocations = 5;
  repeated CalendarEvent events = 6;
  // Freeform text per day, keyed by date.
  map<string, string> day_notes = 7;
  // Freeform text per month, keyed `YYYY-MM`.
  map<string, string> month_notes = 8;
  Settings settings = 9;
  // The work log: stretches of time actually worked.
  repeated WorkSpan work_log = 10;
}

// A stretch of time actually worked, within one day.
message WorkSpan {
  string id = 1;
  string date = 2;
  string start = 3;
  // After the start, on the same day.
  string end = 4;
  optional string note = 5;
}

// A top-level group of projects, e.g. University or Work.
message Area {
  string id = 1;
  string name = 2;
  // CSS colour, e.g. `#60a5fa`.
  string color = 3;
}

message Project {
  string id = 1;
  string area_id = 2;
  string name = 3;
  ProgressMode progress_mode = 4;
  // 0–100, used when progress_mode is MANUAL.
  double manual_progress = 5;
  optional string due_date = 6;
  // Markdown: the project's description (goals, links, decisions).
  string overview_doc = 7;
  repeated LogEntry log = 8;
  bool archived = 9;
  string created_at = 10;
  // For a university course: a case-insensitive regular expression on the
  // course title of USOS classes; matching classes become its tasks.
  optional string course_pattern = 11;
  // Folders for its items, e.g. Classes, in display order.
  repeated ItemGroup groups = 12;
  // The group USOS classes and curricula were last imported into; offered
  // first next time. None if unset or the group is gone.
  optional string import_group_id = 13;
  // The "No group" items are folded away in the project's item list.
  bool ungrouped_collapsed = 14;
}

enum ProgressMode {
  PROGRESS_MODE_UNSPECIFIED = 0;
  PROGRESS_MODE_CHECKLIST = 1;
  PROGRESS_MODE_HOURS = 2;
  PROGRESS_MODE_MANUAL = 3;
}

// A timestamped progress note on a project.
message LogEntry {
  string id = 1;
  string at = 2;
  string text = 3;
  optional string edited_at = 4;
}

// A named folder of a project's items.
message ItemGroup {
  string id = 1;
  string name = 2;
  // Folded away in the project's item list.
  bool collapsed = 3;
}

message Item {
  string id = 1;
  string project_id = 2;
  ItemKind kind = 3;
  string title = 4;
  ItemStatus status = 5;
  optional string due_date = 6;
  // When the class took place; not a deadline.
  optional string held_on = 7;
  optional double estimate_hours = 8;
  // Markdown: details, links, where you stopped.
  optional string notes = 9;
  string created_at = 10;
  // Where the item was imported from, if it was.
  ItemSource source = 11;
  // The project's group it is in; none if unset or the group is gone.
  optional string group_id = 12;
}

enum ItemKind {
  ITEM_KIND_UNSPECIFIED = 0;
  // A class meeting to attend or catch up on (lecture, lab, tutorial).
  ITEM_KIND_CLASS = 1;
  ITEM_KIND_ASSIGNMENT = 2;
  ITEM_KIND_EXAM = 3;
  ITEM_KIND_TASK = 4;
}

enum ItemStatus {
  ITEM_STATUS_UNSPECIFIED = 0;
  ITEM_STATUS_TODO = 1;
  ITEM_STATUS_DOING = 2;
  ITEM_STATUS_DONE = 3;
}

message ItemSource {
  oneof source {
    // A class meeting from the USOS timetable, by its key.
    string usos_meeting = 1;
  }
}

// A slice of an item planned on a day. One item may have many.
message Allocation {
  string id = 1;
  string item_id = 2;
  string date = 3;
  double planned_hours = 4;
  bool done = 5;
  // Hours actually spent; set to planned_hours when checked off.
  optional double actual_hours = 6;
  // Start time; makes the slice a time block on the calendar.
  optional string start = 7;
}

message CalendarEvent {
  string id = 1;
  string title = 2;
  string date = 3;
  // All-day events show in the all-day row; start and end are kept but ignored.
  bool all_day = 4;
  string start = 5;
  string end = 6;
  optional string notes = 7;
  // Unset: the default event colour.
  EventColor color = 8;
  // How it repeats from `date` on; unset: it happens once.
  Recurrence recurrence = 9;
  // A repeating event's dates on which it doesn't happen: deleted there, or
  // changed there into an event of its own.
  repeated string skipped_dates = 10;
  // Set on an occurrence of a repeating event that was changed on its own:
  // the repeating event it came from.
  optional string series_id = 11;
}

// How an event repeats, from its date on.
message Recurrence {
  RecurrenceUnit unit = 1;
  // Every `interval` days or weeks; 0 counts as 1.
  int32 interval = 2;
  // Weekly: the weekdays it happens on; empty means its date's weekday.
  repeated Weekday weekdays = 3;
  // The last date it can happen on; unset: it never ends.
  optional string until = 4;
}

enum RecurrenceUnit {
  RECURRENCE_UNIT_UNSPECIFIED = 0;
  RECURRENCE_UNIT_DAY = 1;
  RECURRENCE_UNIT_WEEK = 2;
}

message Settings {
  // Planning windows and adjustments, each effective from a date.
  repeated CapacityRule capacity_rules = 1;
  // Per-day capacity tweaks, keyed by date.
  map<string, DayCapacity> day_capacity = 2;
  // Length of an event created by clicking the calendar.
  int32 default_event_minutes = 3;
  // The view the calendar opens in.
  CalendarView default_calendar_view = 4;
  UsosSettings usos = 5;
  // The first day of the week in the calendar, mini months and the week
  // journal. Unset means Sunday.
  Weekday week_start = 6;
  // Hours of work aimed for each week; 0 for no target.
  double work_target = 7;
  // Targets for single weeks, keyed by the week's Monday; they override
  // work_target (0 there: no target that week).
  map<string, double> week_work_targets = 8;
  // Reserved time with this label is the planned work, e.g. what "Log as
  // planned" logs. Empty means "Work".
  string work_label = 9;
}

message CapacityRule {
  // The date from which the rule applies.
  string from = 1;
  // One per weekday, Monday first.
  repeated TimeRange windows = 2;
  // Hours added to (or, if negative, removed from) every day.
  double adjustment = 3;
  // Reserved time (sleep, work) per weekday, Monday first. Informational.
  repeated ReservedDay reserved = 4;
}

message ReservedDay {
  repeated TimeRange ranges = 1;
}

// A time range; an end before the start wraps past midnight.
message TimeRange {
  string start = 1;
  string end = 2;
  optional string label = 3;
}

// A relative delta, or an absolute override that wins over everything.
message DayCapacity {
  optional double delta = 1;
  optional double override = 2;
  // This day's own reserved time, once it's edited on the calendar; unset
  // means its weekday's reserved time from the capacity rules.
  ReservedDay reserved = 3;
}

enum CalendarView {
  CALENDAR_VIEW_UNSPECIFIED = 0;
  CALENDAR_VIEW_DAY = 1;
  CALENDAR_VIEW_THREE_DAY = 2;
  CALENDAR_VIEW_WEEK = 3;
  CALENDAR_VIEW_MONTH = 4;
}

// A day of the week, numbered ISO-style: Monday is 1, Sunday is 7.
enum Weekday {
  WEEKDAY_UNSPECIFIED = 0;
  WEEKDAY_MONDAY = 1;
  WEEKDAY_TUESDAY = 2;
  WEEKDAY_WEDNESDAY = 3;
  WEEKDAY_THURSDAY = 4;
  WEEKDAY_FRIDAY = 5;
  WEEKDAY_SATURDAY = 6;
  WEEKDAY_SUNDAY = 7;
}

// An event's colour from Google Calendar's palette. The numbers are Google's
// own event colorId, so a colour maps to Google as is. Unset means the
// calendar's colour.
enum EventColor {
  EVENT_COLOR_UNSPECIFIED = 0;
  EVENT_COLOR_LAVENDER = 1;
  EVENT_COLOR_SAGE = 2;
  EVENT_COLOR_GRAPE = 3;
  EVENT_COLOR_FLAMINGO = 4;
  EVENT_COLOR_BANANA = 5;
  EVENT_COLOR_TANGERINE = 6;
  EVENT_COLOR_PEACOCK = 7;
  EVENT_COLOR_GRAPHITE = 8;
  EVENT_COLOR_BLUEBERRY = 9;
  EVENT_COLOR_BASIL = 10;
  EVENT_COLOR_TOMATO = 11;
}

message UsosSettings {
  // Where the timetable comes from; unset when the import is off.
  oneof source {
    // A Google calendar, by id.
    string google_calendar_id = 1;
    // An iCalendar (.ics) link.
    string ical_url = 2;
  }
  // Class meetings skipped in a review (keys); not offered again. Imported
  // ones are known by their task, so they come back if it's deleted.
  repeated string handled = 3;
}
