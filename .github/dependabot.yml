# Weekly update PRs for the pinned actions (SHA and version comment) and npm
# packages.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # React won't start if react and react-dom differ (error #527): one PR
      # bumps them, and their types, together.
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
