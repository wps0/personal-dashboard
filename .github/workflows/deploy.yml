name: Deploy to GitHub Pages

# Only main is ever published. The site's origin holds the app's data and is
# trusted by the Google OAuth client, so unreviewed code must never reach it.
# Pull requests and other branches don't trigger this workflow at all; a manual
# run from another branch builds and tests it but skips the deploy.
#
# This file can't protect itself: a branch can carry its own edited copy. The
# real guard is the `github-pages` environment, which must be limited to `main`
# (Settings → Environments → github-pages → Deployment branches and tags).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Runs npm install scripts and the build, so it gets no Pages or OIDC rights.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
        env:
          # Not a secret: the OAuth client ID is public, and Google accepts it
          # only from the JavaScript origins allowed in the Cloud console.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
