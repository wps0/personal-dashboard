name: Deploy to GitHub Pages

# Only main is ever published. The site's origin holds the app's data and is
# trusted by the Google OAuth client, so unreviewed code must never reach it.
# Pull requests and other branches don't trigger this workflow at all, and a
# manual run from another branch stops at the build: both jobs use the
# github-pages environment, which only main may use.
#
# This file can't protect itself: a branch can carry its own edited copy. The
# real guard is the `github-pages` environment, which must be limited to `main`
# (Settings → Environments → github-pages → Deployment branches and tags).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Runs npm install scripts and the build, so it gets no Pages or OIDC rights.
    permissions:
      contents: read
    # For the environment's variables (GOOGLE_CLIENT_ID); a repository
    # variable of the same name works too. It doesn't deploy, so it records no
    # deployment, but the environment's branch rule still applies.
    environment:
      name: github-pages
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # A secret isn't a variable, so it doesn't count. Without the Client ID
      # the app still works, but each device has to paste it in Settings.
      - name: Warn if the Google Client ID variable is missing
        if: vars.GOOGLE_CLIENT_ID == ''
        run: echo "::warning title=No Google Client ID::The variable GOOGLE_CLIENT_ID is empty, so the app is built without a Client ID. Set it as a variable of the github-pages environment (Settings → Environments → github-pages → Environment variables) or as a repository variable (Settings → Secrets and variables → Actions → Variables), not as a secret, then run this workflow again."
      - run: npm run build
        env:
          # Not a secret: the OAuth client ID is public, and Google accepts it
          # only from the JavaScript origins allowed in the Cloud console.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
