<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="theme-color"
      content="#0b0d10"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#f5f6f8"
      media="(prefers-color-scheme: light)"
    />
    <script>
      // Apply the stored theme before first paint (see src/theme.ts).
      try {
        var t = localStorage.getItem('personal-dashboard/theme');
        if (t === 'light' || t === 'dark')
          document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='none' stroke='%2333415a' stroke-width='5'/><path d='M16 4a12 12 0 0 1 12 12' fill='none' stroke='%2360a5fa' stroke-width='5'/></svg>"
    />
    <title>Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
